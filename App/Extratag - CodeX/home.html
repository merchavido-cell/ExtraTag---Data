<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtraTag CodeX | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- xterm.js CSS & JS (נדרש עבור הטרמינל) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Fira Code', 'Rubik', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            height: 120px;
            width: auto;
            object-fit: contain;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .user-profile:hover {
            background-color: #21262d;
        }

        .avatar {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .avatar.circle { border-radius: 50%; }
        .avatar.square { border-radius: 0px; }
        .avatar.rounded { border-radius: 10px; }

        .user-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
            color: #f0f6fc;
        }

        .user-status {
            font-size: 11px;
            color: #7d8590;
        }

        /* Top Action Toolbar */
        .top-toolbar {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            overflow-x: auto;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tool-btn:hover {
            background-color: #30363d;
            color: #58a6ff;
            border-color: #8b949e;
        }

        .tool-btn:active {
            transform: translateY(1px);
        }

        .logout-btn {
            background-color: #da3633;
            color: #ffffff;
            border: 1px solid #f85149;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(218, 54, 51, 0.2);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background-color: #b82320;
            box-shadow: 0 4px 12px rgba(218, 54, 51, 0.4);
        }

        /* Main Workspace Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0d1117;
        }

        .workspace-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar File Explorer */
        aside.file-sidebar {
            width: 260px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: bold;
            color: #8b949e;
            text-transform: uppercase;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-file-btn {
            background: none;
            border: 1px solid #30363d;
            color: #58a6ff;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-file-btn:hover {
            background-color: #21262d;
            border-color: #58a6ff;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .file-item {
            padding: 6px 16px;
            font-size: 13px;
            color: #c9d1d9;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background-color: #21262d;
            color: #58a6ff;
        }

        .file-item.active {
            background-color: #1f6feb22;
            color: #58a6ff;
            border-left: 2px solid #58a6ff;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d1117;
        }

        .editor-tab {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 8px 16px;
            font-size: 13px;
            color: #58a6ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .save-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .save-btn:hover {
            background-color: #2ea043;
        }

        .code-editor {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            color: #e6edf3;
            border: none;
            outline: none;
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            tab-size: 4;
        }

        .welcome-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .welcome-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .code-title {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .status-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            text-align: left;
            direction: ltr;
            font-size: 13px;
            color: #7ee787;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #58a6ff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* EMBEDDED TERMINAL PANEL */
        .terminal-panel {
            height: 220px;
            background-color: #010409;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            font-family: 'Fira Code', monospace;
        }

        .terminal-header {
            background-color: #161b22;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #21262d;
            font-size: 12px;
            color: #8b949e;
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f0f6fc;
            font-weight: 600;
        }

        .terminal-close-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .terminal-close-btn:hover {
            color: #f85149;
        }

        .terminal-body {
            flex: 1;
            padding: 8px;
            overflow: hidden;
            background-color: #000;
        }

        /* MODAL DIALOG STYLE */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            width: 420px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 16px;
            color: #f0f6fc;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-option-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .modal-option-btn:hover {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .modal-footer {
            padding: 12px 20px;
            background-color: #0d1117;
            border-top: 1px solid #30363d;
            text-align: right;
        }

        .modal-cancel-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .modal-cancel-btn:hover {
            color: #f0f6fc;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

    <input type="file" id="folderInput" webkitdirectory directory style="display: none;" onchange="handleFolderSelected(event)">
    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelected(event)">

    <div class="top-toolbar">
        <div class="toolbar-group">
            <button class="tool-btn" onclick="openNativeFolderPicker()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>

            <button class="tool-btn" onclick="openNativeFilePicker()">

<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
        let currentProfileEmail = "";
let isFolderOpen = false;
let currentFolderName = "";
let currentFolderPath = null;
let activeTerminal = "cmd";

async function openNativeFolderPicker() {
    try {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.select_folder === 'function') {
            const response = await window.pywebview.api.select_folder();
            const res = typeof response === 'string' ? JSON.parse(response) : response;

            if (res.success) {
                currentFolderPath = res.folder_path;
                currentFolderName = res.folder_name;

                document.getElementById('folderTitle').textContent = `📁 ${currentFolderName}`;
                document.getElementById('fileSidebar').style.display = 'flex';
                isFolderOpen = true;

                await loadFolderContents(currentFolderPath);
                updateStatus(`Loaded folder: ${currentFolderPath}`);
                return;
            }
        }
    } catch (err) {
        console.warn("Native folder picker unavailable, falling back to browser input:", err);
    }

    document.getElementById('folderInput').click();
}

async function loadFolderContents(folderPath) {
    if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.get_folder_contents !== 'function') return;

    try {
        const response = await window.pywebview.api.get_folder_contents(folderPath);
        const res = typeof response === 'string' ? JSON.parse(response) : response;

        if (res.success) {
            const fileTreeEl = document.getElementById('fileTree');
            fileTreeEl.innerHTML = '';

            res.items.forEach(item => {
                if (!item.is_dir) {
                    addNativeFileToSidebar(item.name, item.path);
                }
            });
        }
    } catch (err) {
        console.error("Error fetching folder contents:", err);
    }
}

function addNativeFileToSidebar(fileName, filePath) {
    const fileTreeEl = document.getElementById('fileTree');
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span>📄</span> ${fileName}`;

    item.onclick = async () => {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.read_file === 'function') {
            try {
                const response = await window.pywebview.api.read_file(filePath);
                const res = typeof response === 'string' ? JSON.parse(response) : response;

                if (res.success) {
                    openInMemoryFile(fileName, res.content, item);
                } else {
                    alert(`Error opening file: ${res.error}`);
                }
            } catch (err) {
                console.error("Error reading file:", err);
            }
        }
    };

    fileTreeEl.appendChild(item);
    return item;
}

function openNativeFilePicker() {
    document.getElementById('fileInput').click();
}

function handleFolderSelected(event) {
    const files = event.target.files;
    if (files.length === 0) return;

    const fileTreeEl = document.getElementById('fileTree');
    fileTreeEl.innerHTML = '';

    currentFolderName = files[0].webkitRelativePath.split('/')[0];
    currentFolderPath = currentFolderName;

    document.getElementById('folderTitle').textContent = `📁 ${currentFolderName}`;
    isFolderOpen = true;

    Array.from(files).forEach((file) => {
        addFileToSidebar(file.name, file);
    });

    document.getElementById('fileSidebar').style.display = 'flex';
    updateStatus(`Loaded folder: ${currentFolderName} (${files.length} files)`);
}

function handleFileSelected(event) {
    const files = event.target.files;
    if (files.length > 0) {
        loadFileToEditor(files[0].name, files[0]);
    }
}

function addFileToSidebar(fileName, fileObj = null, defaultContent = "") {
    const fileTreeEl = document.getElementById('fileTree');
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span>📄</span> ${fileName}`;

    item.onclick = () => {
        if (fileObj) {
            loadFileToEditor(fileName, fileObj, item);
        } else {
            openInMemoryFile(fileName, defaultContent, item);
        }
    };

    fileTreeEl.appendChild(item);
    return item;
}

function loadFileToEditor(fileName, fileObj, element = null) {
    const reader = new FileReader();
    reader.onload = function(e) {
        openInMemoryFile(fileName, e.target.result, element);
    };
    reader.readAsText(fileObj);
}

function openInMemoryFile(fileName, content, element = null) {
    document.getElementById('welcomeView').style.display = 'none';
    document.getElementById('editorContainer').style.display = 'flex';

    document.getElementById('currentFileName').textContent = fileName;
    document.getElementById('codeEditor').value = content;

    document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
    if (element) element.classList.add('active');

    updateStatus(`Working on: ${fileName}`);
}

async function handleCreateFileInFolder() {
    const fileName = prompt(`Create new file in '${currentFolderName || 'Workspace'}':`, "new_file.js");
    if (!fileName) return;

    const initialContent = `// ${fileName}\n// Created inside ${currentFolderName || 'Workspace'}\n`;

    document.getElementById('fileSidebar').style.display = 'flex';
    if (!isFolderOpen) {
        document.getElementById('folderTitle').textContent = `📁 Workspace`;
        isFolderOpen = true;
    }

    const newFileElement = addFileToSidebar(fileName, null, initialContent);
    openInMemoryFile(fileName, initialContent, newFileElement);

    await persistFileToDisk(fileName, initialContent, currentFolderPath);
    if (currentFolderPath) {
        await loadFolderContents(currentFolderPath);
    }
}

function handleCreateFile() {
    if (isFolderOpen) {
        handleCreateFileInFolder();
    } else {
        const fileName = prompt("Enter new file name:", "index.js");
        if (fileName) {
            const initialContent = `// ${fileName}\n// Write your code here...\n`;
            openInMemoryFile(fileName, initialContent);
            persistFileToDisk(fileName, initialContent, null);
        }
    }
}

async function persistFileToDisk(fileName, content, folderPath = null) {
    try {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.create_file === 'function') {
            await window.pywebview.api.create_file(fileName, content, folderPath);
            updateStatus(`Real file saved to disk: ${fileName}`);
            return;
        }
    } catch (err) {
        console.warn("Python API error during save:", err);
    }

    const blob = new Blob([content], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.click();
    URL.revokeObjectURL(link.href);

    updateStatus(`File downloaded to computer: ${fileName}`);
}

async function saveCurrentFile() {
    const fileName = document.getElementById('currentFileName').textContent;
    const content = document.getElementById('codeEditor').value;
    await persistFileToDisk(fileName, content, currentFolderPath);
}

/* --- TERMINAL & MODAL FUNCTIONS --- */

function openTerminalPicker() {
    if (!currentFolderPath) {
        alert("Please open a folder first to initialize terminal at that path.");
        return;
    }
    document.getElementById('terminalModal').style.display = 'flex';
}

function closeTerminalModal() {
    document.getElementById('terminalModal').style.display = 'none';
}

function closeTerminal() {
    document.getElementById('terminalPanel').style.display = 'none';
}

// --- אתחול xterm.js: יוצרים את האובייקט בלבד, בלי open()/fit() כאן! ---
const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    convertEol: true
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// פונקציה גלובלית שנקראת מה-Python לרשום פלט לטרמינל
function terminalWrite(text) {
    term.write(text);
}

// שליחת קלט מה-xterm אל ה-Python
term.onData(async (data) => {
    try {
        if (window.pywebview && window.pywebview.api) {
            await window.pywebview.api.send_terminal_input(data);
        }
    } catch (err) {
        term.write("\r\nError sending input: " + err.message + "\r\n");
    }
});

async function selectTerminal(type, displayName) {
    closeTerminalModal();

    activeTerminal = type;
    document.getElementById("activeTerminalType").textContent = displayName;

    // 1. קודם מציגים את הפאנל בפועל
    const panel = document.getElementById("terminalPanel");
    panel.style.display = "flex";

    // 2. נותנים לדפדפן פריים אחד לעדכן את הלייאאוט הפיזי
    requestAnimationFrame(() => {
        // 3. פותחים את xterm רק עכשיו, כשהאלמנט כבר גלוי ובעל מידות אמיתיות
        if (!term.element) {
            term.open(document.getElementById("terminal"));
        }

        // 4. מחשבים מידות רק אחרי שהאלמנט גלוי - קריטי!
        fitAddon.fit();

        term.clear();
        term.focus();
    });

    // 5. הפעלת הטרמינל בפייתון
    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.start_terminal === 'function') {
        await window.pywebview.api.start_terminal(currentFolderPath);
    }
}

function updateStatus(msg) {
    const statusEl = document.getElementById('statusMessage');
    if (statusEl) statusEl.textContent = `// ${msg}`;
}

function getPyWebViewAPI(maxRetries = 20, interval = 100) {
    return new Promise((resolve, reject) => {
        let retries = 0;
        const timer = setInterval(() => {
            if (window.pywebview && window.pywebview.api) {
                clearInterval(timer);
                resolve(window.pywebview.api);
            } else if (retries >= maxRetries) {
                clearInterval(timer);
                reject(new Error("PyWebView API not available"));
            }
            retries++;
        }, interval);
    });
}

/* --- PROFILE FUNCTIONS --- */

async function initProfile() {
    try {
        const api = await getPyWebViewAPI();
        let rawData = await api.get_active_profile();

        if (typeof rawData === 'string') {
            try {
                rawData = JSON.parse(rawData);
            } catch (e) {
                const jsonValid = rawData
                    .replace(/'/g, '"')
                    .replace(/\bTrue\b/g, 'true')
                    .replace(/\bFalse\b/g, 'false')
                    .replace(/\bNone\b/g, 'null');
                rawData = JSON.parse(jsonValid);
            }
        }

        const profileData = rawData.profile || rawData;
        renderUserProfile(profileData);

    } catch (error) {
        console.error("Error loading profile:", error);
        document.getElementById('statusMessage').textContent = `// Profile error: ${error.message}`;
    }
}

function renderUserProfile(profile) {
    const avatarEl = document.getElementById('userAvatar');
    const nameEl = document.getElementById('userName');

    currentProfileEmail = profile.email || profile.exmail || "";

    const firstName = profile.firstName || "";
    const lastName = profile.lastName || "";
    const fullName = `${firstName} ${lastName}`.trim() || "User";

    nameEl.textContent = fullName;

    const firstLetter = firstName ? firstName.charAt(0).toUpperCase() : "?";

    const bgColor = profile.avatarColor || '#30363d';
    const shape = profile.avatarShape || 'circle';
    const textColor = profile.avatarTextColor || '#ffffff';

    avatarEl.textContent = firstLetter;
    avatarEl.style.backgroundColor = bgColor;
    avatarEl.style.color = textColor;
    avatarEl.className = `avatar ${shape.toLowerCase()}`;
}

async function navigateToProfile() {
    try {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.navigate_to === 'function') {
            await window.pywebview.api.navigate_to('home.html', 'Extratag - Profile');
        }
    } catch (error) {
        console.error("Error navigating to profile:", error);
    }
}

async function handleLogout() {
    try {
        if (window.pywebview && window.pywebview.api) {
            const api = window.pywebview.api;

            if (typeof api.logout_by_email === 'function') {
                if (currentProfileEmail) {
                    await api.logout_by_email(currentProfileEmail);
                } else {
                    await api.logout_by_email();
                }
            }

            if (typeof api.navigate_to === 'function') {
                await api.navigate_to('Fastin.html', 'Extratag - CodeX');
            }
        }
    } catch (error) {
        console.error("Logout execution error:", error);
    }
}

if (window.pywebview) {
    initProfile();
} else {
    window.addEventListener('pywebviewready', initProfile);
    document.addEventListener('DOMContentLoaded', initProfile);
}
