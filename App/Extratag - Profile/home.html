<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Home - ExtraTag</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* סרגל עליון (Navbar) */
        .navbar {
            display: flex;
            align-items: center;
            height: 110px;
            padding: 0 40px; 
            background-color: #1e293b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        /* 📐 מיקום הלוגו - מוצמד ומיושר לצד ימין של המסך */
        .app-logo {
            position: absolute;
            right: -10px;      /* הצמדה נקייה לימין */
            top: 50%;          /* מרכוז אנכי מושלם בתוך ה-Navbar */
            transform: translateY(-50%);
            width: 180px;      /* גודל פרופורציונלי וברור */
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }
        
        .app-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 🎯 לוגו הפרופיל - נדחף ומיושר לצד שמאל הקיצוני של המסך */
        .profile-area {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-right: auto; /* דוחף את האלמנט שמאלה ב-RTL */
        }
        
        .profile-avatar {
            width: 55px;
            height: 55px;
            background-color: #38bdf8;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            border: 2px solid #ffffff;
            transition: transform 0.2s;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
        }

        /* מיכל ראשי שמחזיק את התפריט הצדדי ואת התוכן */
        .app-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 110px);
            position: relative;
        }

        /* 🎯 תפריט צדדי בשמאל */
        .sidebar-left {
            width: 180px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 15px;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
        }

        /* המלבנים הקטנים בתפריט */
        .sidebar-item {
            width: 145px;
            height: 35px;
            background-color: #38bdf8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-item:hover {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* תוכן מרכז דף הבית */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-left: 180px; /* תוקן ל-180px שלא יתנגש פיזית עם הבר השמאלי */
        }

        /* 🔥 תיקון הסינטקס כאן: הוסר ה- < ששבר את ה-CSS */
        .main-content h1 {
            font-size: 40px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .main-content p {
            font-size: 18px;
            color: #94a3b8;
        }
        .main-content h1 {
    font-size: 40px;
    margin-bottom: 10px;
    color: #38bdf8;
    direction: ltr; /* 🔥 השורה הזו תגרום לסימן הקריאה להתיישר לסוף האנגלית */
}

        /* ✨ קלאסים מובנים להתאמת צורת האוואטאר לפי בחירת המשתמש */
        .circle { border-radius: 50%; }
        .square { border-radius: 0; }
        .pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
        .hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .heptagon { clip-path: polygon(50% 0%, 85% 15%, 100% 50%, 85% 85%, 50% 100%, 15% 85%, 0% 50%, 15% 15%); }
        .octagon { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="profile-area" onclick="goToProfiles()">
            <div id="user-avatar" class="profile-avatar circle">?</div>
        </div>

        <div class="app-logo">
            <img src="ExtraTag Profile.png" alt="ExtraTag Logo">
        </div>
    </div>

    <div class="app-container">
        
        <div class="main-content">
            <h1 id="welcome-title">Welcome back for ExtraTag!</h1>
            <p dir="ltr">what is your plan today?</p>
        </div>

        <div class="sidebar-left">
            <div class="sidebar-item" onclick="goToHome()">home</div>
            <div class="sidebar-item" onclick="goToApps()">Apps</div>
            <div class="sidebar-item" onclick="goToProfiles()">Profile</div>
            <div class="sidebar-item" onclick="goToSetting()">setting</div>
            <div class="sidebar-item" onclick="signout()">Sign out</div>
        </div>
    </div>

    <script>
        let darkColors = ["black","navy","purple","blue","brown"];
        
        function setTextColor(color) {
            if (darkColors.includes(color)) {
                return "white";
            }
            return "black";
        }

        function goToHome() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.navigate_to('home.html', 'Extratag - Profile');
            }
        }
        function goToApps(){
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.navigate_to('index.html', 'Extratag - Apps');
            }
        }
        function goToSetting(){
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.navigate_to('index.html', 'Extratag - Setting');
            }
        }
        async function signout() {
            if (window.pywebview && window.pywebview.api) {
                try {
                    let success = await window.pywebview.api.logout_from_profile();
                    if (success) {
                        window.pywebview.api.navigate_to('Acounts.html', 'Extratag - Profile');
                    } else {
                        alert("שגיאה בעדכון הסטטוס בקובץ הפרופיל.");
                    }
                } catch (err) {
                    console.log("Error during signout process:", err);
                    window.pywebview.api.navigate_to('Acounts.html', 'Extratag - Profile');
                }
            }
        }

        async function loadCurrentProfile() {
    if (!window.pywebview || !window.pywebview.api) return;

    try {
        let result = await window.pywebview.api.get_active_profile();

        if (typeof result === "string") {
            result = JSON.parse(result);
        }

        console.log("get_active_profile:", result);

        if (!result.success || !result.profile) {
            window.pywebview.api.navigate_to('MoreEditProfile.html', 'Extratag - Profile');
            return;
        }

        let currentProfile = result.profile;

        let firstName = currentProfile.firstName || "U";
        let avatarElement = document.getElementById("user-avatar");

        avatarElement.textContent = firstName.charAt(0).toUpperCase();
        document.getElementById("welcome-title").textContent =
            `Welcome ${firstName}!`;

        let savedColor = currentProfile.avatarColor || "#38bdf8";
        avatarElement.style.backgroundColor = savedColor;

        avatarElement.style.color =
            currentProfile.avatarTextColor || setTextColor(savedColor);

        let savedShape = currentProfile.avatarShape || "circle";
        avatarElement.className = "profile-avatar " + savedShape;

    } catch (err) {
        console.error("Error loading profile:", err);
        alert(err);
    }
}

        function goToProfiles() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.navigate_to('MoreEditProfile.html', 'Extratag - Profile');
            }
        }

        window.addEventListener('pywebviewready', loadCurrentProfile);

        window.onload = function() {
            if (window.pywebview && window.pywebview.api) {
                loadCurrentProfile();
            }
        };
    </script>
</body>
</html>
