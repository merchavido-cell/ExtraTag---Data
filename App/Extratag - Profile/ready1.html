<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>ExtraTag - Intro 1</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: black;
    box-sizing: border-box;
    background-color: #ffffff; 
}


#logo {
    position: absolute;
    top: 20px;      
    right: 13px;       
    width: 150px;    
    height: 100px;    
    z-index: 10;
    /* overflow: hidden; */ /* כבר אין בו צורך אם התמונה לא חורגת */
}

.logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* שומר על יחס הגובה-רוחב של הלוגו ומכניס את כולו לתיבה */
    
    /* מחק או שנה את השורות הבאות: */
    /* transform: scale(4.5); */ 
    /* transform-origin: 50% 52%; */
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 55px;
    margin-bottom: 10px;
}

p {
    font-size: 28px;
    opacity: 0.8;
    margin-bottom: 30px; 
}

button {
    font-size: 32px;
    color: white;
    background-color: #1800ad;
    border: none;
    padding: 15px 40px;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.2s;
}

button:hover {
    background-color: #120080;
}
</style>
</head>
<body>

    <div id="logo">
        <img src="ExtraTag Profile.png" class="logo-img" alt="Logo">
    </div>

<div class="container">
    <h1>Start your Tag here</h1>
    <p>You can to predict your desktop at the best service</p>

    <button onclick="next()">Next ➜</button>
</div>

<script>
function next() {
sessionStorage.setItem("cameFromReady1", "true");
window.pywebview.api.navigate_to('Acounts.html', 'Extratag - Profile'); 
}
</script>

</body>
</html>
