<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtraTag - Profile View</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative; 
        }

        #profile_avatar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-color: white; 
            color: black;
            transition: all 0.3s ease;
        }

        #box {
            background-color: #1e293b;
            width: 420px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
            transition: transform 0.3s ease;
        }

        #box:hover {
            transform: translateY(-5px);
        }

        h2 {
            font-size: 24px;
            color: #38bdf8; 
            margin-top: 0;
            margin-bottom: 15px;
        }

        #name {
            font-size: 18px;
            line-height: 1.6;
            color: #cbd5e1;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            text-align: left;
            margin-bottom: 25px;
            word-wrap: break-word;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            font-size: 16px;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-profile {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-profile:hover {
            background-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .btn-email {
            background-color: #10b981; 
            color: #ffffff;
        }

        .btn-email:hover {
            background-color: #059669;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-email:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-yellow {
            background-color: #eab308; 
            color: #0f172a;
        }

        .btn-yellow:hover {
            background-color: #ca8a04;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        .circle { border-radius: 50%; }
        .square { border-radius: 0; }
        .pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
        .hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .heptagon { clip-path: polygon(50% 0%, 85% 15%, 100% 50%, 85% 85%, 50% 100%, 15% 85%, 0% 50%, 15% 15%); }
        .octagon { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }

        /* --- עיצוב החלון המודאלי המעוצב --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            width: 380px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #10b981;
            font-size: 20px;
        }

        .modal-content p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn-confirm {
            background-color: #10b981;
            color: white;
        }

        .modal-btn-confirm:hover {
            background-color: #059669;
        }

        .modal-btn-cancel {
            background-color: #475569;
            color: #cbd5e1;
        }

        .modal-btn-cancel:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div id="profile_avatar" class="circle" style="display: none;">A</div>

    <div id="box">
        <h2>User Profile</h2>
        
        <div id="name">Loading profile data...</div>

        <div class="button-group">
            <button class="btn btn-profile" onclick="customizeProfile()">Customize Profile</button>
            <button class="btn btn-email" onclick="openExmailModal()">Create ExtraTag Email</button>
            <button class="btn btn-yellow" onclick="newYellowFeature()">Profile update</button>
        </div>
    </div>

    <div id="exmailModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Choose Username</h3>
            <p>Enter your preferred username for the new ExtraTag Email address.</p>
            <input type="text" id="customUsernameInput" class="modal-input" placeholder="e.g. ido, cooluser" oninput="this.value = this.value.replace(/\s+/g, '')">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeExmailModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="submitCustomExmail()">Create</button>
            </div>
        </div>
    </div>

<script>
let firstName = "";
let lastName = "";
let email = "";
let Exmail = "";
let currentProfileRaw = {};

let darkColors = ["black","navy","purple","blue","brown"];

function setTextColor(color) {
    if (darkColors.includes(color)) {
        return "white";
    }
    return "black";
}

async function loadProfile() {
    try {
        console.log("🔥 loading profile...");

        let raw = await window.pywebview.api.get_active_profile();
        console.log("📦 RAW:", raw);

        if (typeof raw === "string") {
            raw = JSON.parse(raw);
        }

        const profile = raw.profile ? raw.profile : raw;
        currentProfileRaw = profile;

        console.log("✅ PROFILE:", profile);

        document.querySelector("h2").innerText = "Hello, " + (profile.firstName || "User");

        let nameDiv = document.getElementById("name");
        if (nameDiv) {
            let emailText = profile.email || "Not set";
            let exmailText = profile.exmail || "Not created yet";
            
            nameDiv.innerHTML = `
                <strong>First Name:</strong> ${profile.firstName || ""}<br>
                <strong>Last Name:</strong> ${profile.lastName || ""}<br>
                <strong>Email:</strong> ${emailText}<br>
                <strong>ExtraTag Email:</strong> ${exmailText}
            `;
        }

        let avatarEl = document.getElementById("profile_avatar");
        if (avatarEl && profile.firstName) {
            avatarEl.innerText = profile.firstName.charAt(0).toUpperCase();
            avatarEl.style.backgroundColor = profile.avatarColor || "white";
            avatarEl.style.color = profile.avatarTextColor || "black";
            avatarEl.className = profile.avatarShape || "circle";
            avatarEl.style.display = "flex";
        }

        // בדיקה והשבתה ויזואלית של כפתור ה-Email במידה וכבר קיים מייל
        let emailBtn = document.querySelector(".btn-email");
        if (emailBtn) {
            if (profile.exmail && profile.exmail.trim() !== "" && profile.exmail !== "Not created yet") {
                emailBtn.disabled = true;
                emailBtn.innerText = "ExtraTag Email Created";
            } else {
                emailBtn.disabled = false;
                emailBtn.innerText = "Create ExtraTag Email";
            }
        }

    } catch (err) {
        console.error("🔥 loadProfile error:", err);
        alert("Error loading profile: " + err);
    }
}

function loadProfileData() {
    loadProfile();
}

window.addEventListener('pywebviewready', loadProfile);

window.onload = function() {
    if (window.pywebview && window.pywebview.api) {
        loadProfile();
    }
};

function customizeProfile() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.navigate_to('EndProfile.html', 'Extratag - Profile');
    }
}

function openExmailModal() {
    if (!currentProfileRaw || Object.keys(currentProfileRaw).length === 0) {
        alert("No profile loaded yet!");
        return;
    }
    
    // בדיקה: אם כבר קיים exmail, עצור והצג התרעה
    if (currentProfileRaw.exmail && currentProfileRaw.exmail.trim() !== "" && currentProfileRaw.exmail !== "Not created yet") {
        alert("You already have an ExtraTag Email address (" + currentProfileRaw.exmail + "). You cannot create another one.");
        return;
    }

    // מילוי ברירת מחדל לפי השם הפרטי, מנוקה מרווחים
    let defaultUser = (currentProfileRaw.firstName || "").toLowerCase().replace(/\s+/g, '');
    document.getElementById("customUsernameInput").value = defaultUser;
    
    document.getElementById("exmailModal").classList.add("active");
    document.getElementById("customUsernameInput").focus();
}

function closeExmailModal() {
    document.getElementById("exmailModal").classList.remove("active");
}

function submitCustomExmail() {
    let chosenUsername = document.getElementById("customUsernameInput").value.trim().toLowerCase();
    chosenUsername = chosenUsername.replace(/\s+/g, ''); // הסרת רווחים מוחלטת מהקצוות ומהאמצע

    if (!chosenUsername) {
        alert("Please enter a valid username without spaces!");
        return;
    }

    closeExmailModal();

    let avatarEl = document.getElementById("profile_avatar");
    currentProfileRaw.avatarTextColor = avatarEl ? (avatarEl.style.color || "black") : "black";
    currentProfileRaw.custom_username = chosenUsername;

    let updatedJson = JSON.stringify(currentProfileRaw);

    window.pywebview.api.create_exmail(updatedJson).then(function(result) {
        let res = typeof result === "string" ? JSON.parse(result) : result;

        if (!res.success) {
            alert("Error: " + res.message);
            return;
        }

        // טעינת הפרופיל המעודכן והנכון שנשמר ישירות מהפייתון
        if (res.updated_profile) {
            currentProfileRaw = res.updated_profile;
        } else {
            currentProfileRaw.exmail = res.email;
        }

        alert("Success! ExtraTag Email created: " + res.email);
        loadProfile(); // רענון תצוגת הפרטים על המסך
    });
}

function newYellowFeature() {
    if (!currentProfileRaw || Object.keys(currentProfileRaw).length === 0) {
        alert("No profile loaded yet!");
        return;
    }

    let avatarEl = document.getElementById("profile_avatar");
    currentProfileRaw.avatarTextColor = avatarEl ? (avatarEl.style.color || "black") : "black";
    
    // מוודאים ליתר ביטחון שגם ה-JS שולח את השדות האלו דלוקים
    currentProfileRaw.is_selected = true;
    currentProfileRaw.is_logged_in = true;

    let updatedJson = JSON.stringify(currentProfileRaw);
    
    window.pywebview.api.save_profile_to_file(updatedJson).then(function(success) {
        let isSuccess = (success === true || success === "true");
        if (isSuccess) {
            sessionStorage.setItem("login_source", "edit_profile");
            window.pywebview.api.navigate_to('home.html', 'Extratag - Profile');
        } else {
            alert("Failed to update profile.");
        }
    });
}
</script>
</body>
</html>
